<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Backend Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .success { color: #22c55e; font-weight: bold; }
        .error { color: #ef4444; font-weight: bold; }
        button {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #7c3aed;
        }
        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
        }
        .log {
            background: white;
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #8b5cf6;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>🧪 Live Chat Backend Test</h1>
    <p>Use this page to test if the backend chat API is working correctly.</p>

    <div class="test-section">
        <h2>Step 1: Check Backend Connection</h2>
        <button onclick="testBackendConnection()">Test Connection</button>
        <div id="connection-result"></div>
    </div>

    <div class="test-section">
        <h2>Step 2: Create Chat Session</h2>
        <button onclick="createSession()">Create Session</button>
        <div id="session-result"></div>
    </div>

    <div class="test-section">
        <h2>Step 3: Send Message</h2>
        <input type="text" id="message-input" placeholder="Type a message..." style="padding: 8px; width: 300px; margin-right: 10px;">
        <button onclick="sendMessage()">Send Message</button>
        <div id="message-result"></div>
    </div>

    <div class="test-section">
        <h2>Step 4: Get Chat History</h2>
        <button onclick="getChatHistory()">Get History</button>
        <div id="history-result"></div>
    </div>

    <div class="test-section">
        <h2>📋 Test Logs</h2>
        <div id="logs"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:4500';
        let sessionId = null;

        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const logClass = type === 'error' ? 'error' : (type === 'success' ? 'success' : '');
            logsDiv.innerHTML = `<div class="log ${logClass}">[${timestamp}] ${message}</div>` + logsDiv.innerHTML;
        }

        async function testBackendConnection() {
            const resultDiv = document.getElementById('connection-result');
            resultDiv.innerHTML = '<p>Testing connection...</p>';
            log('Testing backend connection...');

            try {
                const response = await fetch(`${API_BASE}/health`, {
                    method: 'GET',
                });

                if (response.ok) {
                    resultDiv.innerHTML = '<p class="success">✅ Backend is running!</p>';
                    log('Backend connection successful', 'success');
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">❌ Backend is not running or not accessible</p>
                    <p>Error: ${error.message}</p>
                    <p><strong>Solution:</strong> Start the backend server:</p>
                    <pre>cd support-platform/apps/api
npm run dev</pre>
                `;
                log(`Backend connection failed: ${error.message}`, 'error');
            }
        }

        async function createSession() {
            const resultDiv = document.getElementById('session-result');
            resultDiv.innerHTML = '<p>Creating session...</p>';
            log('Creating chat session...');

            try {
                const response = await fetch(`${API_BASE}/chat/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userEmail: 'test@example.com',
                        userName: 'Test User',
                    }),
                });

                const data = await response.json();
                
                if (data.success) {
                    sessionId = data.session.id;
                    resultDiv.innerHTML = `
                        <p class="success">✅ Session created successfully!</p>
                        <p>Session ID: <strong>${sessionId}</strong></p>
                    `;
                    log(`Session created: ${sessionId}`, 'success');
                } else {
                    throw new Error(data.error || 'Unknown error');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">❌ Failed to create session</p>
                    <p>Error: ${error.message}</p>
                    <p><strong>Solution:</strong> Make sure database is running:</p>
                    <pre>docker ps</pre>
                `;
                log(`Session creation failed: ${error.message}`, 'error');
            }
        }

        async function sendMessage() {
            const resultDiv = document.getElementById('message-result');
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value.trim();

            if (!sessionId) {
                resultDiv.innerHTML = '<p class="error">❌ Create a session first!</p>';
                return;
            }

            if (!message) {
                resultDiv.innerHTML = '<p class="error">❌ Please enter a message!</p>';
                return;
            }

            resultDiv.innerHTML = '<p>Sending message...</p>';
            log(`Sending message: "${message}"`);

            try {
                const response = await fetch(`${API_BASE}/chat/sessions/${sessionId}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sender: 'user',
                        message: message,
                        senderEmail: 'test@example.com',
                    }),
                });

                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <p class="success">✅ Message sent successfully!</p>
                        <p>Message ID: <strong>${data.message.id}</strong></p>
                    `;
                    log(`Message sent successfully: ${data.message.id}`, 'success');
                    messageInput.value = '';
                } else {
                    throw new Error(data.error || 'Unknown error');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">❌ Failed to send message</p>
                    <p>Error: ${error.message}</p>
                `;
                log(`Message send failed: ${error.message}`, 'error');
            }
        }

        async function getChatHistory() {
            const resultDiv = document.getElementById('history-result');

            if (!sessionId) {
                resultDiv.innerHTML = '<p class="error">❌ Create a session first!</p>';
                return;
            }

            resultDiv.innerHTML = '<p>Fetching messages...</p>';
            log('Fetching chat history...');

            try {
                const response = await fetch(`${API_BASE}/chat/sessions/${sessionId}/messages`);
                const data = await response.json();
                
                if (data.success) {
                    const messagesHtml = data.messages.map(msg => `
                        <div style="padding: 10px; margin: 5px 0; background: ${msg.sender === 'user' ? '#e0e7ff' : '#f3e8ff'}; border-radius: 6px;">
                            <strong>${msg.sender === 'user' ? '👤 User' : '💬 Support'}:</strong> ${msg.message}
                            <br><small>${new Date(msg.createdAt).toLocaleString()}</small>
                        </div>
                    `).join('');

                    resultDiv.innerHTML = `
                        <p class="success">✅ Found ${data.messages.length} message(s)</p>
                        ${messagesHtml}
                    `;
                    log(`Retrieved ${data.messages.length} messages`, 'success');
                } else {
                    throw new Error(data.error || 'Unknown error');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">❌ Failed to fetch history</p>
                    <p>Error: ${error.message}</p>
                `;
                log(`History fetch failed: ${error.message}`, 'error');
            }
        }

        // Press Enter to send message
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Auto-test connection on load
        window.addEventListener('load', () => {
            log('Page loaded, ready to test!');
        });
    </script>
</body>
</html>
