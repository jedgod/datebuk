services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: datebuk
      POSTGRES_USER: datebuk
      POSTGRES_PASSWORD: datebuk_dev
    ports:
      - "5432:5432"
    volumes:
      - datebuk_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - datebuk_redis:/data

  coturn:
    image: coturn/coturn:4.6.3
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

volumes:
  datebuk_postgres:
  datebuk_redis:
