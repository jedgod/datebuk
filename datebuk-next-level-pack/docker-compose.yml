services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: datebuk
      POSTGRES_PASSWORD: datebuk
      POSTGRES_DB: datebuk
    ports:
      - "5432:5432"
    volumes:
      - datebuk_pg:/var/lib/postgresql/data
  api:
    build: ./apps/api
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      - db
volumes:
  datebuk_pg:
