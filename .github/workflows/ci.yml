name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Enable corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@9.5.0 --activate

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Enable corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@9.5.0 --activate

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Report-only for now, deliberately: running this against the current tree turns up
      # 115 high and 7 critical existing findings (mostly transitive, via react-router-dom
      # and @expo/metro-config), which a hard-fail gate would immediately block every PR
      # on. Surfacing them here starts the triage backlog the D13/D15 policy calls for
      # without silently breaking CI the moment this workflow lands. Flip `continue-on-error`
      # to `false` once that backlog is worked down to zero high/critical.
      - name: Audit dependencies (high/critical)
        continue-on-error: true
        run: pnpm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
