version: 2
updates:
  # pnpm workspace — Dependabot resolves the workspace from the root manifest and opens
  # PRs against every app/package's dependencies, not just the root's.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
